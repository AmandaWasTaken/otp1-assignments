name: Java Maven CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Download repository
      - name: Checkout repository
        uses: actions/checkout@v6

      # Install Java 17 and cache Maven dependencies
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # Build application and run unit tests
      - name: Build and test with Maven
        run: mvn --batch-mode clean verify
